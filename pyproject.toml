[project]
name = "ojogu-gitai" # what people type for pip install
version = "0.1.1"
description = "AI automatic commit message"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "unidiff>=0.7.5",
    "litellm[google]==1.82.6",
    "rich>=14.3.3",
]

# 1. Define the command name and where the function is
[project.scripts] # what they type to run the tool
gitai = "gitai.main:main"

# 2. Tell the build system where your code lives
[tool.setuptools.packages.find]
where = ["src"]

# 3. Define the build backend
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
